<!DOCTYPE html>
<html>
<head>
    <title>{{ movie.title }}</title>

    <style>
        body{
            font-family: Arial;
        }

        .container{
            width: 60%;
            margin: auto;
        }

        .card{
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
        }

        a{
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Detalle</h1>

        <div class="card">
            <h2>{{ movie.title }}</h2>
            <p><b>Año:</b> {{ movie.year }}</p>
            <p><b>Género:</b> {{ movie.genre }}</p>
            <p><b>Director:</b> {{ movie.director }}</p>
            <p><b>Sinopsis:</b> {{ movie.synopsis }}</p>
        </div>

        <a href="{% url 'index' %}">Volver</a>

    </div>

</body>
</html>
